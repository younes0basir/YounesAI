# Reverse proxy for YounesAI backend on Oracle VM.
# HTTPS: https://84-8-220-241.sslip.io (Let's Encrypt via sslip.io)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 84-8-220-241.sslip.io _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 84-8-220-241.sslip.io;

    ssl_certificate /etc/letsencrypt/live/84-8-220-241.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/84-8-220-241.sslip.io/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Raw IP over HTTP (desktop / legacy) — no redirect so http://84.8.220.241 still works
server {
    listen 80;
    listen [::]:80;
    server_name 84.8.220.241;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
